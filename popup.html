<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI MVP Scope Checker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <p class="eyebrow">Built by <a href="https://agitech.group/" target="_blank" rel="noopener">Agitech</a></p>
    <h1>AI MVP Scope Checker</h1>
    <p>Quickly score whether an AI product idea is scoped tightly enough to build in weeks, not months.</p>
    <label>What are you building?</label>
    <textarea id="idea" placeholder="Example: Voice AI receptionist for dental clinics"></textarea>
    <button id="score">Score scope</button>
    <section id="result" aria-live="polite"></section>
    <footer>
      Need a production build? <a href="https://agitech.group/services/ai-applications" target="_blank" rel="noopener">Talk to Agitech</a>.
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
